<section id="nosotros-hero" class="relative isolate min-h-screen overflow-hidden">
    <div class="pointer-events-none absolute inset-0 z-0" aria-hidden="true">
      <img
        src="https://res.cloudinary.com/dadlhhv4t/image/upload/v1777941569/Panaderia_about_us_ih8hos.png"
        alt=""
        width="1920"
        height="1080"
        class="absolute inset-0 h-full min-h-full w-full min-w-full object-cover object-center"
      />
      <div class="absolute inset-0 bg-gradient-to-b from-stone-950/75 via-stone-950/55 to-stone-950/80"></div>
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_100%_80%_at_50%_35%,transparent_0%,rgba(28,25,23,0.5)_70%)]"></div>
    </div>

    <div
      class="relative z-10 flex min-h-[calc(100vh-5rem)] w-full flex-col items-center justify-center px-6 py-16 text-center sm:px-10 sm:py-20 lg:px-16 lg:py-24"
    >
      <p
        class="mb-5 inline-flex items-center gap-2 rounded-full border border-yellow-400/35 bg-black/30 px-5 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-amber-100 shadow-lg backdrop-blur-md sm:text-sm"
      >
        <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.9)]" aria-hidden="true"></span>
        Nosotros
      </p>

      <h1
        class="mx-auto max-w-3xl text-4xl font-extrabold leading-[1.12] tracking-tight sm:max-w-4xl sm:text-5xl lg:text-6xl xl:text-7xl [text-shadow:0_4px_40px_rgba(0,0,0,0.75),0_2px_16px_rgba(0,0,0,0.5)]"
      >
        <span class="block text-amber-50">El sabor de nuestra</span>
        <span
          class="mt-1 block text-yellow-50 sm:text-yellow-100 [text-shadow:0_2px_3px_rgba(0,0,0,0.95),0_4px_28px_rgba(0,0,0,0.75),0_0_48px_rgba(254,252,232,0.45)]"
        >tradición</span>
        <span class="mt-4 block text-2xl font-bold leading-snug text-amber-100/95 sm:text-3xl lg:text-4xl [text-shadow:0_2px_20px_rgba(0,0,0,0.55)]">
          hecho con <span class="text-yellow-300 [text-shadow:0_1px_3px_rgba(0,0,0,0.9)]">pasión</span>
        </span>
      </h1>
    </div>

</section>
<section class="min-h-screen bg-white">
  <app-timeline [items]="historyItems" />
</section>
