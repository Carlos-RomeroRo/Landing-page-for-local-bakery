<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start relative">
  <div class="space-y-32 py-16 lg:py-40">
    <div *ngFor="let item of items; let i = index"
         class="carousel-section min-h-[50vh] flex flex-col justify-center px-4 transition-all duration-700"
         [attr.data-index]="i"
         [class.opacity-100]="activeIndex() === i"
         [class.opacity-30]="activeIndex() !== i"
         [class.scale-100]="activeIndex() === i"
         [class.scale-95]="activeIndex() !== i"
         (click)="setActive(i)">
      <span class="mb-4 text-7xl font-bold tracking-tighter text-amber-200 dark:text-amber-500/50">{{ item.number }}</span>
      <h3 class="mb-6 text-4xl font-bold leading-tight text-amber-900 dark:text-amber-50 lg:text-5xl">{{ item.title }}</h3>
      <p class="max-w-lg text-xl leading-relaxed text-stone-600 dark:text-stone-300">{{ item.description }}</p>

      <div class="mt-8 lg:hidden overflow-hidden rounded-3xl shadow-2xl">
        <img [src]="item.image" [alt]="item.title" class="w-full h-64 object-cover" />
      </div>

      <!-- Indicador de progreso -->
      <div class="mt-8 flex gap-2">
        <div
          *ngFor="let dot of items; let j = index"
          class="h-1.5 rounded-full transition-all duration-500"
          [ngClass]="{
            'w-8 bg-amber-500': activeIndex() === j,
            'w-1.5 bg-amber-200 dark:bg-stone-600': activeIndex() !== j
          }"
        ></div>
      </div>
    </div>
  </div>

  <div class="hidden lg:block relative h-[45vh] lg:sticky lg:top-32 lg:h-[70vh] mt-10 lg:mt-20">
    <div class="relative h-full">
      <div *ngFor="let item of items; let i = index"
           class="absolute inset-0 transition-all duration-700 rounded-3xl overflow-hidden shadow-2xl"
           [class.opacity-100]="activeIndex() === i"
           [class.opacity-0]="activeIndex() !== i"
           [class.translate-y-0]="activeIndex() === i"
           [class.translate-y-6]="activeIndex() !== i"
           [class.z-10]="activeIndex() === i"
           [class.z-0]="activeIndex() !== i">
        <img [src]="item.image" [alt]="item.title" class="w-full h-full object-cover" />
      </div>

      <div class="absolute inset-x-0 bottom-6 flex justify-center z-20 pointer-events-auto">
        <a routerLink="/productos" class="bg-yellow-500 text-amber-900 font-semibold px-6 py-3 rounded-full shadow-lg hover:bg-yellow-400 transition">
          Ver más
        </a>
      </div>
    </div>
  </div>
</div>
