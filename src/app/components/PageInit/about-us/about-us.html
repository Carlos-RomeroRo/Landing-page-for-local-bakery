<section id="nosotros" class="app-surface min-h-screen pt-32 pb-20">
  <div class="max-w-screen-xl mx-auto px-8">
    <!-- Encabezado -->
    <div class="text-center mb-20 lg:mb-32">
      <h4 class="mb-3 text-sm font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400">
        Conócenos
      </h4>
      <h1 class="text-5xl font-bold leading-tight text-amber-900 dark:text-amber-50 lg:text-7xl">
        Tradición que se siente
      </h1>
      <p class="mx-auto mt-6 max-w-2xl text-xl leading-relaxed text-stone-600 dark:text-stone-300">
        Más que pan, creamos momentos de encuentro. Descubre quiénes somos y cómo hacemos el mejor pan de Zapatoca.
      </p>
    </div>

    <!-- Carrusel sticky -->
    <app-carousel [items]="carouselItems"></app-carousel>
  </div>
</section>
