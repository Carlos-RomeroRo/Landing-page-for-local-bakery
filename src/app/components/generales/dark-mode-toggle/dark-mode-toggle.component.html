<div class="dark-mode-toggle group relative">
  <button
    type="button"
    class="dark-mode-toggle__btn inline-flex h-10 w-10 items-center justify-center rounded-lg border border-amber-50/20 bg-amber-950/25 text-amber-50 transition hover:bg-amber-950/45 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-200/80"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.tooltipLabel()"
    [attr.aria-pressed]="theme.isDark()"
  >
    @if (theme.isDark()) {
      <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4l1.4-1.4m10-10 1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"
        />
      </svg>
    } @else {
      <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"
        />
      </svg>
    }
  </button>

  <span
    class="dark-mode-toggle__tooltip pointer-events-none absolute bottom-[calc(100%+0.55rem)] left-1/2 z-50 -translate-x-1/2 whitespace-nowrap rounded-lg bg-stone-900 px-3 py-1.5 text-xs font-medium text-white opacity-0 shadow-lg transition-opacity duration-200 group-hover:opacity-100 group-focus-within:opacity-100"
    role="tooltip"
  >
    {{ theme.tooltipLabel() }}
    <span class="dark-mode-toggle__tooltip-arrow" aria-hidden="true"></span>
  </span>
</div>
